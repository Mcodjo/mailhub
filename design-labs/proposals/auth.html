<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domial — Connexion</title>
<link rel="stylesheet" href="design-system.css">
<style>
body {
  background: var(--gray);
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: var(--s6) var(--s4);
}

/* ---- Carte centrale ---- */
.auth-card {
  background: var(--white);
  border: var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--sh-2);
  padding: var(--s7) var(--s6);
  width: 100%;
  max-width: 380px;
  text-align: center;
}

/* Logo */
.auth-logo { margin-bottom: var(--s6); }
.auth-logo img { height: 44px; }

/* Titre */
.auth-card h1 {
  font-size: var(--fs-lg);
  font-weight: 700;
  letter-spacing: -.03em;
  margin-bottom: var(--s2);
}
.auth-card .sub {
  font-size: var(--fs-sm);
  color: var(--ink-55);
  margin-bottom: var(--s6);
}

/* Bouton Google */
.btn-google {
  display: flex; align-items: center; justify-content: center; gap: var(--s3);
  width: 100%; min-height: 48px; padding: 12px 20px;
  font: 600 var(--fs-sm)/1 var(--font); color: var(--ink);
  background: var(--white);
  border: 1.5px solid var(--gray-mid);
  border-radius: var(--r-md);
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
  margin-bottom: var(--s5);
}
.btn-google:hover { border-color: var(--ink-30); box-shadow: var(--sh-1); }
.btn-google svg { flex: none; }

/* Séparateur */
.sep {
  display: flex; align-items: center; gap: var(--s3);
  font-size: var(--fs-xs); font-weight: 600; color: var(--ink-30);
  margin-bottom: var(--s5);
}
.sep::before, .sep::after { content: ''; flex: 1; height: 1px; background: var(--gray-mid); }

/* Formulaire */
.auth-form { text-align: left; }
.auth-form .field { margin-bottom: var(--s3); }
.auth-form .field-label {
  display: block; font-size: var(--fs-xs); font-weight: 700;
  color: var(--ink-55); margin-bottom: var(--s2);
}
.auth-form .input { background: var(--gray); border-color: transparent; }
.auth-form .input:focus-visible { background: var(--white); border-color: var(--steel); }

.forgot {
  display: block; text-align: right;
  font-size: var(--fs-xs); color: var(--ink-30);
  margin-top: var(--s2); margin-bottom: var(--s5);
  transition: color .15s;
}
.forgot:hover { color: var(--steel); text-decoration: none; }

/* Footer carte */
.auth-foot {
  margin-top: var(--s5);
  font-size: var(--fs-xs); color: var(--ink-30);
}
.auth-foot a { color: var(--steel); font-weight: 600; }

/* Lien bas de page */
.page-foot {
  margin-top: var(--s5);
  font-size: var(--fs-xs); color: var(--ink-30);
  text-align: center;
}
.page-foot a { color: var(--ink-55); }

/* ---- Responsive ---- */
@media (max-width: 440px) {
  .auth-card { padding: var(--s6) var(--s5); border-radius: var(--r-lg); }
}
</style>
</head>
<body>

<div>
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <img src="assets/logo/domial-horizontal.svg" alt="Domial">
    </div>

    <h1>Bon retour</h1>
    <p class="sub">Connectez-vous pour gérer vos boîtes professionnelles.</p>

    <!-- Google OAuth -->
    <button class="btn-google" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continuer avec Google
    </button>

    <!-- Séparateur -->
    <div class="sep">ou</div>

    <!-- Formulaire e-mail -->
    <form class="auth-form" novalidate>
      <div class="field">
        <label class="field-label" for="email">Adresse e-mail</label>
        <input id="email" class="input" type="email" placeholder="vous@exemple.fr" autocomplete="email">
      </div>
      <div class="field">
        <label class="field-label" for="pwd">Mot de passe</label>
        <input id="pwd" class="input" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <a class="forgot" href="#">Mot de passe oublié ?</a>
      <button class="btn btn-primary btn-block" type="submit">Se connecter</button>
    </form>

    <p class="auth-foot">Pas encore de compte ? <a href="#">Créer un compte</a></p>

  </div>

  <p class="page-foot">
    <a href="#">Mentions légales</a> · <a href="#">Confidentialité</a>
  </p>
</div>

</body>
</html>
