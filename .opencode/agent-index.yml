  - nom: drx-referencement
    description: "Analyse le référencement SEO/AEO/GEO avec des preuves mesurées, la découvrabilité dans les moteurs à réponse et les améliorations à transmettre à drx-code."
    tags: ["referencement", "seo", "aeo", "geo", "moteurs-a-reponse", "moteurs-generatifs", "donnees-structurees", "contenu-utile", "entites", "citabilite", "accessibilite", "performance-mesuree", "webmcp-experimental"]
