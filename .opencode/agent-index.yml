  - nom: drx-test
    description: "Conçoit la stratégie de tests, la couverture et la non-régression, y compris les contrats motion Remotion, l’accessibilité WCAG et le versioning des outils."
    tags: ["tests", "couverture", "unitaire", "integration", "regression", "contrat", "performance", "motion", "remotion", "accessibilite", "wcag", "captions", "playwright", "axe-core", "mouvement-reduit", "acceptation-technique", "versioning-outils", "revue-manuelle"]
